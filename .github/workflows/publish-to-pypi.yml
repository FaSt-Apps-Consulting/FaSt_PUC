name: Publish to PyPI

# Tests (pytest + ruff) and build run on every push to any branch; publishing is gated:
#   - Test PyPI on every push to `main` (skipped when the version is unchanged)
#   - Test PyPI first, then PyPI when a `vX.Y.Z` version tag is pushed
#
# Authentication uses Trusted Publishing (OIDC) - no API tokens or secrets needed.
#
# One-time setup (after this workflow is merged and pushed to GitHub):
#   1. PyPI (https://pypi.org/manage/account/publishing/): add a trusted publisher
#      -> GitHub, owner "FaSt-Apps-Consulting", repo "FaSt_PUC",
#         workflow "publish-to-pypi.yml", environment "pypi"
#   2. TestPyPI (https://test.pypi.org/manage/account/publishing/): same settings,
#      but with environment "testpypi"
#   3. Recommended: in the repository Settings -> Environments -> "pypi", enable
#      "Required reviewers" for manual approval before every PyPI release.

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uvx ruff check .

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.12
      - name: Build wheel and sdist
        run: uv build
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to Test PyPI
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fast-puc/
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Skip if version already published to Test PyPI
        id: version-check
        run: |
          SKIP=$(python3 -c "
          import json, re, urllib.request
          import pathlib
          wheel = sorted(pathlib.Path('dist').glob('*.whl'))[0].name
          version = re.search(r'-(\d[\d.]*)-', wheel).group(1)
          try:
              data = json.load(urllib.request.urlopen('https://test.pypi.org/pypi/fast-puc/json'))
              published = version in data.get('releases', {})
          except Exception:
              published = False
          print('true' if published else 'false')
          ")
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
      - name: Publish to Test PyPI
        if: steps.version-check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, publish-to-testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fast-puc/
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1